<!DOCTYPE html>
<html>
<head>
    <title>Game Suit</title>

    <style>
        body {
            font-family: Arial;
            background: #ffe4ef;
            text-align: center;
            padding: 30px;
        }

        .kotak {
            background: white;
            max-width: 400px;
            margin: auto;
            padding: 25px;
            border-radius: 20px;
        }

        h1 {
            color: #d94f87;
        }

        select, button {
            padding: 10px;
            margin: 8px;
            border-radius: 10px;
            border: 1px solid pink;
        }

        button {
            background: #f48fb1;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #e45d91;
        }

        #hasil {
            color: #c43c76;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="kotak">
    <h1>🎮 GAME SUIT 🎮</h1>
    <p>Pilih permainan yang kamu mau!</p>

    <select id="jenis" onchange="ubahPilihan()">
        <option value="batu">Batu Gunting Kertas</option>
        <option value="gajah">Gajah Orang Semut</option>
        <option value="jari">Suit Jari</option>
    </select>

    <br>

    <select id="pilihan"></select>

    <br>

    <button onclick="mainSuit()">MULAI MAIN</button>

    <h3 id="hasil">Hasil permainan muncul di sini</h3>
</div>

<script>
    function ubahPilihan() {
        let jenis = document.getElementById("jenis").value;
        let pilihan = document.getElementById("pilihan");

        if (jenis == "batu") {
            pilihan.innerHTML = `
                <option value="Batu">✊ Batu</option>
                <option value="Gunting">✌️ Gunting</option>
                <option value="Kertas">✋ Kertas</option>`;
        } 
        else if (jenis == "gajah") {
            pilihan.innerHTML = `
                <option value="Gajah">🐘 Gajah</option>
                <option value="Orang">🧑 Orang</option>
                <option value="Semut">🐜 Semut</option>`;
        } 
        else {
            pilihan.innerHTML = `
                <option value="Jempol">👍 Jempol</option>
                <option value="Telunjuk">☝️ Telunjuk</option>
                <option value="Kelingking">🤙 Kelingking</option>`;
        }
    }

    function mainSuit() {
        let jenis = document.getElementById("jenis").value;
        let user = document.getElementById("pilihan").value;
        let hasil = document.getElementById("hasil");

        let aturan = {
            batu: ["Batu", "Gunting", "Kertas"],
            gajah: ["Gajah", "Orang", "Semut"],
            jari: ["Jempol", "Telunjuk", "Kelingking"]
        };

        let komputer = aturan[jenis][Math.floor(
            Math.random() * 3
        )];

        let menang = {
            batu: {
                Batu: "Gunting",
                Gunting: "Kertas",
                Kertas: "Batu"
            },
            gajah: {
                Gajah: "Orang",
                Orang: "Semut",
                Semut: "Gajah"
            },
            jari: {
                Jempol: "Telunjuk",
                Telunjuk: "Kelingking",
                Kelingking: "Jempol"
            }
        };

        if (user == komputer) {
            hasil.innerHTML =
                "Kamu: " + user +
                "<br>Komputer: " + komputer +
                "<br>HASIL: SERI! 😄";
        } 
        else if (menang[jenis][user] == komputer) {
            hasil.innerHTML =
                "Kamu: " + user +
                "<br>Komputer: " + komputer +
                "<br>KAMU MENANG! 🎉";
        } 
        else {
            hasil.innerHTML =
                "Kamu: " + user +
                "<br>Komputer: " + komputer +
                "<br>KAMU KALAH! 😅";
        }
    }

    ubahPilihan();
</script>

</body>
</html>
